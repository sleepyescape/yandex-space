<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Яндекс Спейс — заставка</title>
<style>
  /* тот же Inter, что и в приложении */
  @font-face { font-family: 'Inter'; font-weight: 700; src: url(../app/fonts/inter-cyrillic-700-normal.woff2) format('woff2'); unicode-range: U+0400-04FF; }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url(../app/fonts/inter-latin-700-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #1d1d1d; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { width: 100vw; height: auto; max-height: 100vh; display: block; }
  body.capture { background: #fff; }
  body.capture svg { width: 1920px; height: 1080px; max-height: none; }
  text { font-family: Inter, system-ui, sans-serif; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip"><rect x="-240" y="-370" width="480" height="480" rx="44"/></clipPath>
    <clipPath id="rowClip"><rect x="0" y="0" width="1920" height="938"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>
  <g id="bgDots"></g>
  <g id="header"></g>
  <circle id="wipe" cx="960" cy="600" r="0" fill="#FFDB4D"/>
  <circle id="wipe2" cx="960" cy="600" r="0" fill="#fff"/>
  <g id="cards"></g>
  <g id="burst"></g>
  <g id="finale"></g>
</svg>

<script src="../app/icons.js"></script>
<script>
// ---------- brand (app/styles.css, app/app.js) ----------
const INK = '#21201F';
const YELLOW = '#FFDB4D', SPACE_YELLOW = '#FDBF1F', RED = '#FC3F1D', GREEN = '#2DB84D', BLUE = '#2C6CF6';
const ICON_SRC = '../app/assets/icon.png';
const SW = 9; // stroke width, as in the reference doodle

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, x) => a + (b - a) * x;
const easeOutBack = (x, s = 2.2) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const easeInBack = (x, s = 1.8) => (s + 1) * x * x * x - s * x * x;
const easeInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutElastic = x => x === 0 ? 0 : x === 1 ? 1 :
  Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
// small repeating hop: 0 → -h → 0 every `period` seconds
const hop = (t, start, period, h) => t < start ? 0 : -h * Math.abs(Math.sin(Math.PI * (t - start) / period));

// ---------- character parts ----------
const head = (rx = 88, ry = 100) => `
  <rect x="-28" y="-215" width="56" height="70" fill="#fff" stroke="${INK}" stroke-width="${SW}"/>
  <ellipse cx="0" cy="-292" rx="${rx}" ry="${ry}" fill="#fff" stroke="${INK}" stroke-width="${SW}"/>`;
const eyes = (dx = 0, y = -282) => `
  <ellipse cx="${-30 + dx}" cy="${y}" rx="8" ry="11" fill="${INK}"/>
  <ellipse cx="${30 + dx}" cy="${y}" rx="8" ry="11" fill="${INK}"/>`;
const torso = fill => `
  <path d="M-172,60 C-170,-60 -140,-135 -50,-165 L50,-165 C140,-135 170,-60 172,60 Z"
        fill="${fill}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>`;
const sleeveLines = `
  <path d="M-118,-40 L-112,60 M118,-40 L112,60" stroke="${INK}" stroke-width="${SW}" stroke-linecap="round" fill="none"/>`;

// scalloped "curly" hair cap generated around the top of the head
function curlyHair(color, { cx = 0, cy = -300, rx = 112, ry = 118, from = 195, to = 345, n = 9, fringeY = -318, fringeN = 4 } = {}) {
  const P = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push(P(from + (to - from) * i / n));
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const r = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]) * 0.62;
    d += ` A${r.toFixed(1)},${r.toFixed(1)} 0 0 1 ${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)}`;
  }
  // fringe back across the forehead, smaller curls
  const end = pts[pts.length - 1], start = pts[0];
  for (let i = 0; i <= fringeN; i++) {
    const x = lerp(end[0] - 6, start[0] + 6, i / fringeN);
    const y = fringeY + (i % 2 ? 14 : 0) + Math.abs(i - fringeN / 2) * -4;
    d += ` A26,26 0 0 1 ${x.toFixed(1)},${y.toFixed(1)}`;
  }
  d += ` A40,40 0 0 1 ${start[0].toFixed(1)},${start[1].toFixed(1)} Z`;
  return `<path d="${d}" fill="${color}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>`;
}

// ---------- characters (origin = table top, centre) ----------
const HIJAB = '#B5545F', HIJAB_DARK = '#8E3B46';
const CHAR = {
  // long wavy dark hair, beige blazer over a white top, gold pendant
  karina: () => `
    <path d="M-104,-300 C-120,-420 120,-420 104,-300 C150,-210 118,-130 165,-30 L-165,-30 C-118,-130 -150,-210 -104,-300 Z" fill="#2E1D14" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    ${torso('#DCD3C2')}
    <path d="M-50,-165 L0,-40 L50,-165 Z" fill="#fff" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    <path d="M-50,-165 L-78,-60 L-20,-80 M50,-165 L78,-60 L20,-80" stroke="${INK}" stroke-width="${SW}" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    ${head()}
    <circle cx="0" cy="-118" r="9" fill="#E9B949" stroke="${INK}" stroke-width="5"/>
    <path d="M-92,-262 C-110,-392 -10,-418 50,-398 C112,-378 118,-310 94,-262 C70,-330 20,-352 -6,-334 C-40,-318 -66,-292 -92,-262 Z" fill="#2E1D14" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    <path d="M-88,-250 C-128,-200 -96,-150 -136,-90 C-150,-60 -128,-20 -110,-8 C-100,-60 -70,-90 -76,-150 C-80,-190 -72,-220 -88,-250 Z" fill="#2E1D14" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    <path d="M88,-250 C128,-200 96,-150 136,-90 C150,-60 128,-20 110,-8 C100,-60 70,-90 76,-150 C80,-190 72,-220 88,-250 Z" fill="#2E1D14" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    ${eyes(-4, -276)}`,

  // hijab: snug around the head, framing the face, draped over the shoulders; round glasses
  zarina: () => {
    let dots = '';
    const spots = [[-70,-380],[0,-398],[70,-380],[-98,-320],[98,-320],[-130,-130],[-150,-80],[-105,-60],[125,-120],[150,-70],[95,-55],[-40,-70],[40,-80],[0,-120]];
    for (const [x, y] of spots) dots += `<circle cx="${x}" cy="${y}" r="6" fill="#F2C27A" opacity=".85"/>`;
    return `
    ${torso('#2A2326')}
    <path d="M0,-404 C70,-404 106,-356 106,-296 C106,-246 98,-214 104,-186 C150,-166 176,-120 182,-64 C120,-36 60,-30 0,-30 C-60,-30 -120,-36 -182,-64 C-176,-120 -150,-166 -104,-186 C-98,-214 -106,-246 -106,-296 C-106,-356 -70,-404 0,-404 Z"
          fill="${HIJAB}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    ${dots}
    <path d="M-100,-190 C-60,-150 40,-140 120,-176 M-60,-160 C-20,-110 60,-96 150,-110" stroke="${HIJAB_DARK}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-286" rx="72" ry="88" fill="#F3E3D8" stroke="${INK}" stroke-width="7"/>
    <ellipse cx="0" cy="-276" rx="64" ry="78" fill="#fff" stroke="${INK}" stroke-width="${SW}"/>
    ${eyes(0, -276)}
    <circle cx="-30" cy="-276" r="26" fill="none" stroke="${INK}" stroke-width="6"/>
    <circle cx="30" cy="-276" r="26" fill="none" stroke="${INK}" stroke-width="6"/>
    <path d="M-5,-280 Q0,-286 5,-280" stroke="${INK}" stroke-width="6" fill="none"/>`;
  },

  // brown bob, black leather jacket, burgundy zip top
  bob: () => `
    <path d="M-112,-196 C-140,-430 140,-430 112,-196 C80,-188 60,-200 60,-230 L-60,-230 C-60,-200 -80,-188 -112,-196 Z" fill="#6E4A33" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    ${torso('#262626')}
    <path d="M-46,-165 L-30,-60 L30,-60 L46,-165 Z" fill="#7C2333" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    <path d="M0,-150 L0,-60" stroke="#C9C9C9" stroke-width="5"/>
    <path d="M-50,-165 L-92,-60 M50,-165 L92,-60" stroke="#6b6b6b" stroke-width="7" stroke-linecap="round"/>
    ${head(86, 98)}
    <path d="M-92,-286 C-106,-424 98,-438 98,-292 C60,-330 0,-352 -40,-330 C-60,-318 -80,-300 -92,-286 Z" fill="#6E4A33" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    ${eyes(4, -270)}`,

  // light-brown curls, white hoodie
  curly: () => `
    <ellipse cx="0" cy="-160" rx="96" ry="40" fill="#F4F2EC" stroke="${INK}" stroke-width="${SW}"/>
    ${torso('#F4F2EC')}
    ${head()}
    <path d="M-40,-150 L-46,-60 M40,-150 L46,-60" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-46" cy="-56" r="7" fill="${INK}"/><circle cx="46" cy="-56" r="7" fill="${INK}"/>
    ${sleeveLines}
    ${curlyHair('#A8794C', { rx: 120, ry: 124, n: 10, fringeY: -326 })}
    ${eyes(0, -270)}`,

  // long straight hair with a centre part, oversized beige shirt
  longhair: () => `
    <path d="M-110,-300 C-120,-420 120,-420 110,-300 L124,-30 L-124,-30 Z" fill="#5C3824" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    ${torso('#E5CE9E')}
    <path d="M-40,-165 L0,-70 L40,-165 Z" fill="#D9BE8A" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    <path d="M-44,-168 L-86,-150 L-56,-92 L-6,-128 M44,-168 L86,-150 L56,-92 L6,-128" fill="#E5CE9E" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    ${head(86, 100)}
    <path d="M0,-394 C-70,-394 -102,-340 -100,-268 L-118,-20 L-84,-24 L-74,-250 C-70,-320 -40,-360 0,-370 C40,-360 70,-320 74,-250 L84,-24 L118,-20 L100,-268 C102,-340 70,-394 0,-394 Z" fill="#5C3824" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    ${eyes(0, -272)}`,
};

// ---------- props ----------
const PROPS = {
  phone: () => `
    <g class="device">
      <rect x="-58" y="-100" width="116" height="200" rx="20" fill="${INK}"/>
      <rect x="-46" y="-84" width="92" height="168" rx="10" fill="#fff"/>
      <circle cx="0" cy="-12" r="30" fill="${GREEN}"/>
      <path d="M-14,-12 L-3,0 L16,-24" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="-30" y="34" width="60" height="10" rx="5" fill="#ddd"/>
    </g>`,
  pin: () => `
    <ellipse class="ring" cx="0" cy="50" rx="40" ry="12" fill="none" stroke="${BLUE}" stroke-width="6"/>
    <ellipse class="ring" cx="0" cy="50" rx="40" ry="12" fill="none" stroke="${BLUE}" stroke-width="6"/>
    <g class="pinBody">
      <path d="M0,46 C-10,24 -48,-4 -48,-38 A48,48 0 1 1 48,-38 C48,-4 10,24 0,46 Z" fill="${RED}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
      <circle cx="0" cy="-38" r="16" fill="#fff" stroke="${INK}" stroke-width="7"/>
    </g>`,
  party: () => {
    const c = [RED, GREEN, BLUE, YELLOW, '#7B4FD6', SPACE_YELLOW];
    return c.map((col, i) => `<circle class="confetti" r="${i % 2 ? 11 : 14}" fill="${col}" stroke="${INK}" stroke-width="5"/>`).join('');
  },
  laptop: () => `
    <g class="steam">
      <path d="M135,-110 C120,-130 150,-145 135,-165" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M163,-110 C148,-130 178,-145 163,-165" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
    <path d="M178,-62 C210,-62 210,-20 178,-20" stroke="${INK}" stroke-width="${SW}" fill="none"/>
    <path d="M118,-82 L182,-82 L176,0 L124,0 Z" fill="#fff" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
    <rect x="-130" y="-150" width="230" height="150" rx="14" fill="#C9CBD3" stroke="${INK}" stroke-width="${SW}"/>
    <circle cx="-15" cy="-75" r="13" fill="#fff" stroke="${INK}" stroke-width="5"/>`,
};

// ---------- scene data: goals, icons and colours as in the app's goal picker ----------
const CARDS = [
  { icon: 'nocall',  bg: '#FFF1B8', fg: '#B58500', lines: ['Забронировать', 'столик без звонков'], chars: ['karina'], prop: 'phone' },
  { icon: 'near',    bg: '#E1ECFF', fg: '#2C6CF6', lines: ['Быстро найти', 'свободный столик', 'рядом'], chars: ['zarina'], prop: 'pin' },
  { icon: 'company', bg: '#E6F7EA', fg: '#1C8C38', lines: ['Найти место', 'для большой компании'], chars: ['bob', 'curly'], prop: 'party' },
  { icon: 'work',    bg: '#F1E8FF', fg: '#7B4FD6', lines: ['Спокойно посидеть', 'и поработать'], chars: ['longhair'], prop: 'laptop' },
];
const CS = 0.86;                               // card scale on the 16:9 stage
const SLOTS = [[286, 600], [735, 600], [1184, 600], [1633, 600]];
const CENTER = [960, 600];
const ENTER = [0.05, 0.40, 0.75, 1.10];       // card entrance times
const SHUFFLE1 = [1.90, 0.30], SHUFFLE2 = [2.20, 0.30], COLLAPSE = [2.50, 0.30];
const ORDER1 = [2, 3, 0, 1];                  // halves leapfrog each other
const ORDER2 = [1, 0, 3, 2];                  // then neighbours swap
const GROUP_LAYOUT = { bob: [-100, 0.74], curly: [100, 0.78] };
const FINAL_ROW = ['karina', 'zarina', 'bob', 'curly', 'longhair'];
const DURATION = 4.0;

// ---------- build ----------
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, html = '') => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (html) e.innerHTML = html;
  return e;
};
const iconSvg = (name, size, color) =>
  YS_ICONS.icon(name, size, `x="${-size / 2}" y="${-size / 2}" style="color:${color}"`).replace('stroke-width="1.9"', 'stroke-width="2.6"');
const appIcon = size => el('image', { href: ICON_SRC, x: -size / 2, y: -size / 2, width: size, height: size });

// soft confetti dots in the background
(() => {
  const g = $('bgDots');
  const cols = CARDS.map(c => c.bg);
  for (let i = 0; i < 30; i++) {
    const x = 30 + (i * 397) % 1860, y = 30 + (i * 233) % 1020;
    g.appendChild(el('circle', { cx: x, cy: y, r: 9 + (i % 4) * 5, fill: cols[i % 4] }));
  }
})();

// header: app icon + wordmark, as in the goal picker
const header = $('header');
const headerInner = el('g');
header.appendChild(headerInner);
headerInner.appendChild(appIcon(78));
const hw = el('text', { x: 56, y: 15, 'font-size': 44, 'font-weight': 700, fill: INK, 'letter-spacing': -0.7 });
hw.innerHTML = `Яндекс <tspan fill="${SPACE_YELLOW}">Спейс</tspan>`;
headerInner.appendChild(hw);

const cardEls = CARDS.map((c, i) => {
  const g = el('g');
  g.appendChild(el('rect', { x: -240, y: -370, width: 480, height: 740, rx: 44, fill: c.bg, stroke: INK, 'stroke-width': SW }));
  const clip = el('g', { 'clip-path': 'url(#cardClip)' });
  const charEls = c.chars.map(name => {
    const cg = el('g', {}, CHAR[name]());
    clip.appendChild(cg);
    return { name, g: cg };
  });
  g.appendChild(clip);
  const table = el('rect', { x: -220, y: 100, width: 440, height: 36, rx: 14, fill: '#fff', stroke: INK, 'stroke-width': SW });
  const propG = el('g', {}, PROPS[c.prop]());
  if (c.prop === 'laptop') { g.appendChild(propG); g.appendChild(table); }
  else { g.appendChild(table); g.appendChild(propG); }
  // goal badge (same icon as the app tile) + tile number
  const badge = el('g', {}, `<circle r="44" fill="#fff" stroke="${INK}" stroke-width="${SW}"/>${iconSvg(c.icon, 52, c.fg)}`);
  g.appendChild(badge);
  const num = el('text', { x: 196, y: -306, 'text-anchor': 'middle', 'font-size': 36, 'font-weight': 700, fill: c.fg });
  num.textContent = i + 1;
  g.appendChild(num);
  const lineEls = c.lines.map(txt => {
    const t = el('text', { 'text-anchor': 'middle', 'font-weight': 700, 'font-size': 40, fill: INK });
    t.textContent = txt;
    g.appendChild(t);
    return t;
  });
  $('cards').appendChild(g);
  return { g, charEls, propG, lineEls, badge, num };
});

// shrink captions that would overflow the card
function fitCaptions() {
  for (const c of cardEls) {
    let size = 40;
    for (const t of c.lineEls) {
      t.setAttribute('font-size', 40);
      const w = t.getComputedTextLength();
      if (w > 420) size = Math.min(size, Math.floor(40 * 420 / w));
    }
    c.lineEls.forEach(t => t.setAttribute('font-size', size));
    c.fontSize = size;
  }
}

// burst particles
const burstEls = [];
const burstCols = [YELLOW, RED, GREEN, BLUE, '#7B4FD6', SPACE_YELLOW, '#fff'];
for (let i = 0; i < 16; i++) {
  const b = el('circle', { r: 0, fill: burstCols[i % burstCols.length], stroke: INK, 'stroke-width': 6 });
  $('burst').appendChild(b);
  burstEls.push(b);
}

// finale: app icon + wordmark, then everyone behind one long table
const finale = $('finale');
const LOGO_ICON = 230, LOGO_GAP = 50, LOGO_SIZE = 150, LOGO_Y = 360;
const logoIcon = el('g');
logoIcon.appendChild(appIcon(LOGO_ICON));
finale.appendChild(logoIcon);
const letterEls = [];
let logoIconX = 0;
function buildWordmark() {
  const full = 'Яндекс Спейс';
  const probe = el('text', { 'font-size': LOGO_SIZE, 'font-weight': 700 });
  probe.textContent = full;
  finale.appendChild(probe);
  const total = probe.getComputedTextLength();
  const chars = [...full];
  const xs = chars.map((_, k) => probe.getSubStringLength(0, k));
  const ws = chars.map((_, k) => probe.getSubStringLength(k, 1));
  probe.remove();
  const left = 960 - (LOGO_ICON + LOGO_GAP + total) / 2;
  logoIconX = left + LOGO_ICON / 2;
  const textLeft = left + LOGO_ICON + LOGO_GAP;
  chars.forEach((ch, k) => {
    if (ch === ' ') return;
    const lg = el('g');
    const t = el('text', { 'font-size': LOGO_SIZE, 'font-weight': 700, fill: k > 6 ? SPACE_YELLOW : INK, 'text-anchor': 'middle', y: LOGO_SIZE * 0.36 });
    t.textContent = ch;
    lg.appendChild(t);
    finale.appendChild(lg);
    letterEls.push({ g: lg, x: textLeft + xs[k] + ws[k] / 2, k });
  });
}
const row = el('g', { 'clip-path': 'url(#rowClip)' });
finale.appendChild(row);
const rowChars = FINAL_ROW.map(name => {
  const g = el('g', {}, CHAR[name]());
  row.appendChild(g);
  return g;
});
const longTable = el('rect', { x: 500, y: 928, width: 920, height: 40, rx: 16, fill: '#fff', stroke: INK, 'stroke-width': SW });
finale.appendChild(longTable);

// ---------- render one frame at time t (seconds) ----------
function render(t) {
  // --- header ---
  const hIn = easeOutBack(prog(t, 0.0, 0.4), 2.4);
  const hOut = easeInBack(prog(t, COLLAPSE[0], 0.25));
  headerInner.setAttribute('transform', `translate(${lerp(-260, 110, hIn) - hOut * 400},110) rotate(${(1 - hIn) * -30})`);

  // --- cards ---
  cardEls.forEach((c, i) => {
    const t0 = ENTER[i];
    const pIn = prog(t, t0, 0.38);
    let [x, y] = SLOTS[i];
    let s = easeOutBack(pIn, 2.6);
    let rot = (1 - easeOutBack(pIn)) * (i % 2 ? 14 : -14);

    // shuffle 1 & 2: cards leap to another slot along an arc
    const shuffle = (from, order, [st, du], up) => {
      const p = easeInOutCubic(prog(t, st, du));
      const [tx, ty] = SLOTS[order[from]];
      const [fx, fy] = SLOTS[from];
      const arc = Math.sin(Math.PI * p);
      return { x: lerp(fx, tx, p), y: lerp(fy, ty, p) + (up ? -1 : 1) * arc * 110, s: 1 - arc * 0.2, rot: arc * (up ? -12 : 12) };
    };
    if (t >= SHUFFLE1[0]) {
      ({ x, y, s, rot } = shuffle(i, ORDER1, SHUFFLE1, i < 2));
      if (t >= SHUFFLE2[0]) ({ x, y, s, rot } = shuffle(ORDER1[i], ORDER2, SHUFFLE2, ORDER1[i] % 2 === 0));
    }
    // collapse into the centre with a spin
    if (t >= COLLAPSE[0]) {
      const slot = ORDER2[ORDER1[i]];
      const e = easeInBack(prog(t, COLLAPSE[0], COLLAPSE[1]));
      x = lerp(SLOTS[slot][0], CENTER[0], e);
      y = lerp(SLOTS[slot][1], CENTER[1], e);
      s = Math.max(0, 1 - e);
      rot = e * (i % 2 ? 220 : -220);
    }
    c.g.setAttribute('transform', `translate(${x},${y}) rotate(${rot}) scale(${Math.max(0, s) * CS})`);
    c.g.style.display = s <= 0.001 ? 'none' : '';

    // characters pop up from behind the table, then keep bouncing
    c.charEls.forEach((ch, k) => {
      const st = t0 + 0.08 + k * 0.06;
      const p = easeOutBack(prog(t, st, 0.34), 2.4);
      const bounce = hop(t, st + 0.34, 0.42, 16 + (k % 2) * 6);
      const [gx, gs] = GROUP_LAYOUT[ch.name] || [0, 1];
      const squash = 1 + 0.06 * Math.sin(Math.PI * clamp((t - st - 0.2) / 0.2));
      ch.g.setAttribute('transform', `translate(${gx},${100 + (1 - p) * 420 + bounce}) scale(${gs * (2 - squash)},${gs * squash})`);
    });

    // badge + number spring in
    const be = easeOutElastic(prog(t, t0 + 0.16, 0.5));
    c.badge.setAttribute('transform', `translate(-176,-306) rotate(${(1 - be) * -90}) scale(${be})`);
    c.num.setAttribute('opacity', prog(t, t0 + 0.2, 0.15));

    // caption lines spring up one after another
    const fs = c.fontSize;
    c.lineEls.forEach((ln, k) => {
      const p = prog(t, t0 + 0.12 + k * 0.05, 0.3);
      const e = easeOutBack(p, 2);
      const ly = 200 + k * (fs + 10) + (c.lineEls.length === 2 ? 22 : 0);
      ln.setAttribute('transform', `translate(0,${ly + (1 - e) * 40}) scale(${clamp(e, 0, 2)})`);
      ln.setAttribute('opacity', clamp(p * 3));
    });

    // props
    const pe = easeOutElastic(prog(t, t0 + 0.2, 0.45));
    const name = CARDS[i].prop;
    if (name === 'phone') {
      const dev = c.propG.querySelector('.device');
      dev.setAttribute('transform', `translate(150,${-200 + hop(t, t0 + 0.5, 0.42, 14)}) rotate(${12 - 8 * pe}) scale(${pe})`);
    } else if (name === 'pin') {
      const body = c.propG.querySelector('.pinBody');
      body.setAttribute('transform', `translate(0,${hop(t, t0 + 0.55, 0.42, 30)}) scale(${pe})`);
      c.propG.querySelectorAll('.ring').forEach((r, k) => {
        const ph = ((t - t0 - 0.4 - k * 0.3) % 0.6 + 0.6) % 0.6 / 0.6;
        r.setAttribute('rx', 30 + ph * 60); r.setAttribute('ry', 9 + ph * 18);
        r.setAttribute('opacity', t > t0 + 0.4 ? (1 - ph) : 0);
      });
      c.propG.setAttribute('transform', 'translate(155,-215)');
    } else if (name === 'party') {
      c.propG.querySelectorAll('.confetti').forEach((cf, k) => {
        const st = t0 + 0.25 + k * 0.05;
        const p = clamp((t - st) / 0.9);
        const ang = -Math.PI / 2 + (k - 2.5) * 0.45;
        const dist = 150 * easeOutBack(clamp(p * 1.6), 1.2);
        cf.setAttribute('cx', Math.cos(ang) * dist);
        cf.setAttribute('cy', -210 + Math.sin(ang) * dist + 120 * p * p);
        cf.setAttribute('opacity', t < st ? 0 : 1);
      });
    } else if (name === 'laptop') {
      c.propG.setAttribute('transform', `translate(0,${100 + (1 - easeOutBack(prog(t, t0 + 0.14, 0.32), 2)) * 300})`);
      const steam = c.propG.querySelector('.steam');
      steam.setAttribute('transform', `translate(0,${-((t * 60) % 14)})`);
      steam.setAttribute('opacity', t > t0 + 0.5 ? 0.5 + 0.5 * Math.sin(t * 14) : 0);
    }
  });

  // --- yellow wipe, then white (the app's splash background) + burst ---
  $('wipe').setAttribute('r', easeInOutCubic(prog(t, 2.62, 0.32)) * 1150);
  $('wipe2').setAttribute('r', easeInOutCubic(prog(t, 2.80, 0.32)) * 1150);
  burstEls.forEach((b, k) => {
    const p = prog(t, 2.74, 0.5);
    const ang = k / burstEls.length * Math.PI * 2;
    const d = 80 + 640 * (1 - Math.pow(1 - p, 3));
    b.setAttribute('cx', CENTER[0] + Math.cos(ang) * d * 1.3);
    b.setAttribute('cy', CENTER[1] - 120 + Math.sin(ang) * d * 0.75);
    const r = p > 0 && p < 1 ? (k % 2 ? 22 : 30) * (1 - p) : 0;
    b.setAttribute('r', r);
    b.setAttribute('stroke-width', Math.min(6, r / 3));
  });

  // --- logo: icon spins in like the app splash, letters hop in one by one ---
  const ip = prog(t, 2.86, 0.55);
  const ie = easeOutElastic(ip);
  logoIcon.setAttribute('transform', `translate(${logoIconX},${LOGO_Y + hop(t, 3.55, 0.4, 10)}) rotate(${(1 - ie) * -200}) scale(${ie})`);
  logoIcon.style.display = ip <= 0 ? 'none' : '';
  letterEls.forEach((L, idx) => {
    const p = prog(t, 2.96 + idx * 0.03, 0.32);
    const e = easeOutBack(p, 3);
    const j = t < 3.9 ? hop(t, 3.55 + idx * 0.03, 0.3, 14) : 0;
    L.g.setAttribute('transform', `translate(${L.x},${LOGO_Y + (1 - e) * -140 + j}) scale(${e})`);
    L.g.setAttribute('opacity', p > 0 ? 1 : 0);
  });

  // --- everyone together behind the long table ---
  rowChars.forEach((g, k) => {
    const st = 3.08 + k * 0.06;
    const p = easeOutBack(prog(t, st, 0.34), 2.4);
    const bounce = hop(t, st + 0.34, 0.36, 12);
    const x = 960 + (k - 2) * 180;
    g.setAttribute('transform', `translate(${x},${930 + (1 - p) * 300 + bounce}) scale(.6)`);
  });
  const tp = easeOutBack(prog(t, 3.0, 0.3), 2);
  longTable.setAttribute('transform', `translate(960,948) scale(${tp}) translate(-960,-948)`);
}

// ---------- boot ----------
const params = new URLSearchParams(location.search);
window.render = render;
const imgReady = new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = ICON_SRC; });
Promise.all([document.fonts.load('700 40px Inter', 'Яндекс Спейс'), imgReady]).then(() => document.fonts.ready).then(() => {
  fitCaptions();
  buildWordmark();
  if (params.has('capture')) {
    document.body.classList.add('capture');
    render(0);
    window.ready = true;
  } else {
    const t0 = performance.now();
    const loop = now => {
      const t = ((now - t0) / 1000) % (DURATION + 1.0); // 1s pause on the logo before looping
      render(Math.min(t, DURATION));
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
});
</script>
</body>
</html>
